<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitacion de Boda</title>
    <style>
        body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f0f0f0;
}
        #tarjeta {
            width: 100%;
            max-width: 800px;
            height: auto;
            min-height: 600px;
            background-image: url('fondo tarjeta.png');
            background-size: cover ;
            margin: auto;
            position: relative;
            overflow: hidden;
        }
        #foto-contenedor {
    position: absolute;
    width: 350px;
    height: 350px;
    left: 225px;
    top: 100px;
}
#mitad-izquierda {
    position: absolute;
    width: 175px;
    height: 350px;
    background-image: url('foto2.jpeg');
    background-size: 350px 350px;
    background-position: left;
}
#mitad-derecha {
    position: absolute;
    left: 175px;
    width: 175px;
    height: 350px;
    background-image: url('foto2.jpeg');
    background-size: 350px 350px;
    background-position: right;
} 

#texto {
    position: absolute;
    width: 250px;
    text-align: center;
    left: 50px;
    top: 5px;
    opacity: 0;
    animation: aparecer 1s ease 1.5s forwards;
    font-size: 20px;
    font-family:  'PinyonScript';
}

#boton {
    margin-top: 10px;
    padding: 8px 16px;
    background-color: #7a9e7e;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}


@keyframes abrir-izquierda {
    from { transform: translateX(0); }
    to { transform: translateX(-175px); }
}

@keyframes abrir-derecha {
    from { transform: translateX(0); }
    to { transform: translateX(175px); }
}

@keyframes aparecer {
    from { opacity: 0; }
    to { opacity: 1; }
}
@font-face {
    font-family: 'PinyonScript';
    src: url('PinyonScript-Regular.ttf');
}


#mitad-izquierda {
    animation: abrir-izquierda 1.5s ease forwards;
}

#mitad-derecha {
    animation: abrir-derecha 1.5s ease forwards;
}


    </style>
</head>
<body>

    <div id="tarjeta">
        <audio id="musica" loop>
    <source src="Onlyyou.mp3">
</audio>
    <div id="foto-contenedor">
    <div id="texto">
    <p>¡¡Cordón de tres dobleces no se rompe pronto 
        Eclesistes 4:12!</p>
    <p>Maria Alejandra y Kevin</p>
    <p>Queremos que celebres con nosotros</p>
    <p>Lugar: por confirmar</p>
    <p>Fecha: 21 de noviembre</p>
    <p>Hora: 4 pm</p>
    <p>Traje formal</p>
    <p>Lluvia de sobres</p>
    <p>¡Nuestra Boda!</p>
    <a href="https://wa.me/573337170317?text=¡Hola👋! Confirmo mi asistencia a la boda💐" target="_blank">
    <button id="boton">Confirmar asistencia antes del 21 de septiembre</button>
</a>
</div>    
        <div id="mitad-izquierda"></div>
        <div id="mitad-derecha"></div>
    </div>
</div>

        var musica = document.getElementById('musica');
        document.body.addEventListener('click', function() {
            musica.play().catch(function(e) {
                console.log('Error:', e);
            });
        }, {once: true});
    };
</script>
</body>
</html>
